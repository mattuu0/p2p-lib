# Run with `dart run ffigen --config ffigen.yaml`.
name: TailcatCgoBindings
description: |
  Bindings for `src/tailcat_cgo.h` (the tailcat-cgo C ABI).

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: 'lib/src/tailcat_cgo_bindings_generated.dart'
headers:
  entry-points:
    - 'src/tailcat_cgo.h'
  include-directives:
    - 'src/tailcat_cgo.h'
comments:
  style: any
  length: full
